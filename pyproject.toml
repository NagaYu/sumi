[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sumi-pii"
version = "0.1.0"
description = "Japanese PII detection that holds up on hard negatives — a 0.13B CPU token classifier, a rule layer, and reversible masking."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Sumi contributors" }]
keywords = [
  "pii", "privacy", "japanese", "ner", "token-classification",
  "redaction", "anonymization", "presidio", "onnx",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Natural Language :: Japanese",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Security",
  "Topic :: Text Processing :: Linguistic",
]

dependencies = [
  "torch>=2.2",
  "transformers>=4.48",
  "numpy>=1.24",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
data = ["datasets>=2.16", "huggingface-hub>=0.23"]
presidio = ["presidio-analyzer>=2.2", "presidio-anonymizer>=2.2"]
ginza = ["spacy>=3.7", "ja-ginza"]          # only needed to run baseline (B)
app = ["gradio>=4.0"]
onnx = ["onnx>=1.15", "onnxruntime>=1.17"]
export = ["gguf>=0.9", "mlx>=0.15; sys_platform == 'darwin'"]
bench = ["llama-cpp-python>=0.2"]
dev = ["pytest>=7.4"]

[project.scripts]
sumi = "sumi.cli:main"

[project.urls]
Homepage = "https://github.com/NagaYu/sumi"
Repository = "https://github.com/NagaYu/sumi"
Issues = "https://github.com/NagaYu/sumi/issues"
Model = "https://huggingface.co/NagaYu/sumi-ja-pii"
Dataset = "https://huggingface.co/datasets/NagaYu/sumi-ja-pii-corpus"

[tool.setuptools.packages.find]
include = ["sumi*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
