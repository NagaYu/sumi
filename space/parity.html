<!doctype html>
<meta charset="utf-8">
<title>Sumi JS/Python parity check</title>
<style>body{font:13px/1.6 ui-monospace,Menlo,monospace;padding:16px;white-space:pre-wrap}
.ok{color:#2f6f4e}.bad{color:#b3402f;font-weight:700}</style>
<div id="out">running…</div>
<script type="module">
// Verifies that the browser port produces the same spans as the Python library
// on the built-in examples. examples.json carries `sumi_python`, generated by the
// real SumiDetector, so this is a direct comparison rather than a re-assertion.
import { SumiDetector } from './sumi.js';

const out = document.getElementById('out');
const log = (s, cls) => { out.innerHTML += `\n${cls ? `<span class="${cls}">${s}</span>` : s}`; };
out.textContent = 'loading model…';

const key = s => `${s.start}-${s.end}-${s.label}`;

try {
  const examples = await fetch('examples.json').then(r => r.json());
  const det = await SumiDetector.load(() => {});
  out.textContent = 'model ready\n';

  let failures = 0, compared = 0;
  for (const ex of examples) {
    const res = await det.detect(ex.text);
    const got = res.spans.map(key).sort();
    const want = (ex.sumi_python || []).map(key).sort();
    compared += want.length;

    const missing = want.filter(k => !got.includes(k));
    const extra = got.filter(k => !want.includes(k));
    const ok = missing.length === 0 && extra.length === 0;
    if (!ok) failures++;

    log(`\nexample ${ex.id}: python=${want.length} js=${got.length} ` +
        (ok ? 'MATCH' : 'MISMATCH'), ok ? 'ok' : 'bad');
    if (missing.length) log('  missing in JS: ' + JSON.stringify(missing), 'bad');
    if (extra.length) log('  extra in JS  : ' + JSON.stringify(extra), 'bad');
    for (const s of res.spans) {
      log(`    ${String(s.start).padStart(4)}-${String(s.end).padEnd(4)} ` +
          `${s.label.padEnd(13)} ${(s.meta.from || '').padEnd(6)} ` +
          `${s.score.toFixed(3)}  ${JSON.stringify(s.text)}`);
    }
  }
  log(`\n=== ${failures === 0 ? 'ALL EXAMPLES MATCH' : failures + ' EXAMPLE(S) DIFFER'} ` +
      `(${compared} reference spans) ===`, failures === 0 ? 'ok' : 'bad');
} catch (e) {
  log('FATAL: ' + e.message, 'bad');
  console.error(e);
}
</script>
